{% extends "base.html" %}

{% block content %}
    <h1 class="mb-4">Films</h1>

    {% for movie in movies %}
    <div class="card mb-3" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">{{ movie.title }}</h5>
            <p class="card-text">{{ movie.year }} · IMDB {{ movie.note }}</p>
        </div>
    </div>

    {% endfor %}
{% endblock %}
